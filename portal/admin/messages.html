<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — Admin Portal</title>
  <link rel="stylesheet" href="../portal.css">
</head>
<body>

  <nav class="portal-nav">
    <a href="dashboard.html" class="nav-brand">Jake Lewien <span>| Admin</span></a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="clients.html">Clients</a>
      <a href="quote.html">Quotes</a>
      <a href="invoice.html">Invoices</a>
      <a href="messages.html" class="active">Messages</a>
    </div>
    <div class="nav-user">
      <span class="nav-user-name" id="userName"></span>
      <span class="admin-badge">Admin</span>
      <button class="btn-logout" id="logoutBtn">Log out</button>
    </div>
  </nav>

  <div class="portal-page">
    <div class="split-layout">

      <!-- Sidebar: client list -->
      <div class="split-sidebar">
        <div style="padding:0 16px 12px;font-size:11px;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);">Clients</div>
        <div id="clientList"><div class="empty-state" style="padding:32px;"><p>Loading…</p></div></div>
      </div>

      <!-- Main: thread -->
      <div class="split-main">
        <div id="noSelection" style="display:flex;align-items:center;justify-content:center;height:300px;">
          <div class="empty-state"><div class="empty-icon">💬</div><p>Select a client to view their messages.</p></div>
        </div>

        <div id="threadPanel" style="display:none;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
            <h2 id="threadClientName" style="font-family:'Tektur',sans-serif;font-size:18px;"></h2>
          </div>

          <div class="card" style="padding:0;">
            <div id="threadContainer" style="padding:24px;min-height:300px;max-height:500px;overflow-y:auto;"></div>
            <div style="border-top:1px solid var(--border);padding:16px;">
              <div style="display:flex;gap:8px;">
                <input type="text" class="form-input" id="replyInput" placeholder="Reply to client…">
                <button class="btn btn-primary" id="replyBtn">Send</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { auth, db } from '../firebase-config.js';
    import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { doc, getDoc, collection, query, where, orderBy, onSnapshot, addDoc, getDocs, serverTimestamp, updateDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    let adminUid = null;
    let activeClientId = null;
    let unsubThread = null;
    let allClients = [];
    let unreadCounts = {};

    const params = new URLSearchParams(window.location.search);
    const preClient = params.get('client');

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = '../index.html'; return; }
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      if (!userDoc.exists() || userDoc.data().role !== 'admin') { window.location.href = '../index.html'; return; }
      adminUid = user.uid;
      document.getElementById('userName').textContent = userDoc.data().name || user.email;
      await loadClients();
      subscribeUnread();
      if (preClient) selectClient(preClient);
    });

    async function loadClients() {
      const snap = await getDocs(query(collection(db, 'clients'), orderBy('name')));
      allClients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderClientList();
    }

    function subscribeUnread() {
      onSnapshot(query(collection(db, 'messages'), where('senderRole', '==', 'client'), where('read', '==', false)), (snap) => {
        unreadCounts = {};
        snap.docs.forEach(d => {
          const cid = d.data().clientId;
          unreadCounts[cid] = (unreadCounts[cid] || 0) + 1;
        });
        renderClientList();
      });
    }

    function renderClientList() {
      const container = document.getElementById('clientList');
      if (allClients.length === 0) {
        container.innerHTML = '<div class="empty-state" style="padding:32px;"><p>No clients yet.</p></div>';
        return;
      }
      container.innerHTML = allClients.map(c => `
        <div class="sidebar-item ${c.id === activeClientId ? 'active' : ''}" onclick="selectClient('${c.id}')">
          <div style="flex:1;">
            <div class="sidebar-item-name">${c.name}</div>
            ${c.company ? `<div class="sidebar-item-sub">${c.company}</div>` : ''}
          </div>
          ${unreadCounts[c.id] ? `<span class="unread-dot" title="${unreadCounts[c.id]} unread"></span>` : ''}
        </div>`).join('');
    }

    window.selectClient = async (clientId) => {
      activeClientId = clientId;
      renderClientList();

      const client = allClients.find(c => c.id === clientId);
      document.getElementById('threadClientName').textContent = client?.name || '';
      document.getElementById('noSelection').style.display = 'none';
      document.getElementById('threadPanel').style.display = '';

      if (unsubThread) unsubThread();

      const q = query(collection(db, 'messages'), where('clientId', '==', clientId), orderBy('createdAt', 'asc'));
      unsubThread = onSnapshot(q, (snap) => {
        const container = document.getElementById('threadContainer');
        if (snap.empty) {
          container.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><p>No messages yet.</p></div>';
          return;
        }
        container.innerHTML = `<div class="message-thread">
          ${snap.docs.map(d => {
            const m = d.data();
            const isAdmin = m.senderRole === 'admin';
            const projectTag = m.projectName ? `<div class="message-project-tag">re: ${escHtml(m.projectName)}</div>` : '';
            return `<div class="message-wrap ${isAdmin ? 'from-admin' : ''}">
              <div class="message-bubble ${isAdmin ? 'from-admin' : 'from-client'}">
                ${projectTag}${escHtml(m.content)}
              </div>
              <div class="message-meta">${isAdmin ? 'You' : (client?.name || 'Client')} · ${formatDate(m.createdAt)}</div>
            </div>`;
          }).join('')}
        </div>`;
        container.scrollTop = container.scrollHeight;
        markClientMessagesRead(clientId);
      });
    };

    async function markClientMessagesRead(clientId) {
      const q = query(collection(db, 'messages'), where('clientId', '==', clientId), where('senderRole', '==', 'client'), where('read', '==', false));
      const snap = await getDocs(q);
      snap.docs.forEach(d => updateDoc(d.ref, { read: true }));
    }

    document.getElementById('replyBtn').addEventListener('click', sendReply);
    document.getElementById('replyInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); }
    });

    async function sendReply() {
      const input = document.getElementById('replyInput');
      const content = input.value.trim();
      if (!content || !activeClientId) return;

      const btn = document.getElementById('replyBtn');
      btn.disabled = true;

      try {
        await addDoc(collection(db, 'messages'), {
          clientId: activeClientId,
          senderId: adminUid,
          senderRole: 'admin',
          content,
          projectId: '',
          projectName: '',
          read: false,
          createdAt: serverTimestamp()
        });
        input.value = '';
      } catch (err) {
        showToast('Failed to send.', 'error');
      }
      btn.disabled = false;
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (unsubThread) unsubThread();
      await signOut(auth);
      window.location.href = '../index.html';
    });

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.classList.remove('show'), 3000);
    }
    function formatDate(val) {
      if (!val) return '';
      const d = val?.toDate ? val.toDate() : new Date(val);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }
    function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  </script>

</body>
</html>
