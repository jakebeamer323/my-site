<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoices — Admin Portal</title>
  <link rel="stylesheet" href="../portal.css">
</head>
<body>

  <nav class="portal-nav">
    <a href="dashboard.html" class="nav-brand">Jake Lewien <span>| Admin</span></a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="clients.html">Clients</a>
      <a href="quote.html">Quotes</a>
      <a href="invoice.html" class="active">Invoices</a>
      <a href="requests.html">Requests <span class="unread-dot" id="reqDot" style="display:none;"></span></a>
      <a href="messages.html">Messages</a>
    </div>
    <div class="nav-user">
      <span class="nav-user-name" id="userName"></span>
      <span class="admin-badge">Admin</span>
      <button class="btn-logout" id="logoutBtn">Log out</button>
    </div>
  </nav>

  <div class="portal-page">
    <div class="portal-content wide">

      <div class="page-header">
        <h1>Invoices</h1>
        <button class="btn btn-primary" id="newInvoiceBtn">+ New Invoice</button>
      </div>

      <div style="display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start;">

        <!-- List -->
        <div class="card" style="padding:0;">
          <div style="padding:14px 16px;border-bottom:1px solid var(--border);">
            <span class="card-title">All Invoices</span>
          </div>
          <div id="invoicesList"><div class="empty-state" style="padding:32px;"><p>Loading…</p></div></div>
        </div>

        <!-- Editor -->
        <div id="editorPanel">
          <div class="card">
            <div class="card-header">
              <span class="card-title" id="editorTitle">New Invoice</span>
              <div style="display:flex;gap:6px;">
                <button class="btn btn-danger btn-sm" id="deleteInvoiceBtn" style="display:none;">Delete</button>
                <button class="btn btn-outline btn-sm" id="markSentBtn" style="display:none;">Mark as Sent</button>
                <button class="btn btn-outline btn-sm" id="markPaidBtn" style="display:none;">Mark as Paid</button>
                <button class="btn btn-primary btn-sm" id="saveInvoiceBtn">Save</button>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Client *</label>
                <select class="form-select" id="invoiceClient" required>
                  <option value="">— Select client —</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Project (optional)</label>
                <select class="form-select" id="invoiceProject">
                  <option value="">— No project —</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Status</label>
                <select class="form-select" id="invoiceStatus">
                  <option value="draft">Draft</option>
                  <option value="sent">Sent</option>
                  <option value="paid">Paid</option>
                  <option value="overdue">Overdue</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Due Date</label>
                <input type="date" class="form-input" id="invoiceDue">
              </div>
            </div>

            <hr class="divider" style="margin:16px 0;">
            <span class="card-title">Line Items</span>

            <table class="line-items" style="margin-top:12px;">
              <thead><tr>
                <th style="width:50%;">Description</th>
                <th style="width:15%;">Qty</th>
                <th style="width:20%;">Unit Price</th>
                <th style="width:12%;">Total</th>
                <th style="width:3%;"></th>
              </tr></thead>
              <tbody id="lineItemsBody"></tbody>
            </table>

            <button class="btn btn-outline btn-sm" id="addLineBtn" style="margin-top:4px;">+ Add Line</button>

            <div class="totals-section">
              <div class="totals-inner">
                <div class="totals-row total-row">
                  <span class="totals-label">Total</span>
                  <span class="totals-value" id="grandTotal">$0.00</span>
                </div>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { auth, db } from '../firebase-config.js';
    import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { doc, getDoc, setDoc, addDoc, deleteDoc, collection, getDocs, query, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    let allClients = {};
    let allProjects = {};
    let currentInvoiceId = null;
    let lineItems = [];

    const params = new URLSearchParams(window.location.search);
    const preloadId = params.get('id');

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = '../index.html'; return; }
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      if (!userDoc.exists() || userDoc.data().role !== 'admin') { window.location.href = '../index.html'; return; }
      document.getElementById('userName').textContent = userDoc.data().name || user.email;
      await Promise.all([loadClients(), loadProjects(), loadInvoicesList()]);
      if (preloadId) loadInvoice(preloadId);
      else addLineItem();
    });

    async function loadClients() {
      const snap = await getDocs(query(collection(db, 'clients'), orderBy('name')));
      const select = document.getElementById('invoiceClient');
      snap.docs.forEach(d => {
        allClients[d.id] = d.data().name;
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = d.data().name;
        select.appendChild(opt);
      });
    }

    async function loadProjects() {
      const snap = await getDocs(collection(db, 'projects'));
      snap.docs.forEach(d => { allProjects[d.id] = { ...d.data(), id: d.id }; });
    }

    document.getElementById('invoiceClient').addEventListener('change', () => {
      const clientId = document.getElementById('invoiceClient').value;
      const projSelect = document.getElementById('invoiceProject');
      projSelect.innerHTML = '<option value="">— No project —</option>';
      Object.values(allProjects)
        .filter(p => p.clientId === clientId)
        .forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.name;
          projSelect.appendChild(opt);
        });
    });

    async function loadInvoicesList() {
      const snap = await getDocs(query(collection(db, 'invoices'), orderBy('createdAt', 'desc')));
      const container = document.getElementById('invoicesList');
      if (snap.empty) { container.innerHTML = '<div class="empty-state" style="padding:32px;"><p>No invoices yet.</p></div>'; return; }
      container.innerHTML = snap.docs.map(d => {
        const inv = d.data();
        return `<div class="sidebar-item ${d.id === currentInvoiceId ? 'active' : ''}" onclick="loadInvoice('${d.id}')">
          <div style="flex:1;">
            <div class="sidebar-item-name">${allClients[inv.clientId] || '—'}</div>
            <div class="sidebar-item-sub">${formatCurrency(inv.total)} · <span class="badge ${badgeClass(inv.status)}" style="font-size:10px;padding:1px 6px;">${inv.status}</span></div>
          </div>
        </div>`;
      }).join('');
    }

    window.loadInvoice = async (id) => {
      currentInvoiceId = id;
      const invDoc = await getDoc(doc(db, 'invoices', id));
      if (!invDoc.exists()) return;
      const inv = invDoc.data();

      document.getElementById('editorTitle').textContent = 'Edit Invoice';
      document.getElementById('deleteInvoiceBtn').style.display = '';
      document.getElementById('markSentBtn').style.display = inv.status === 'draft' ? '' : 'none';
      document.getElementById('markPaidBtn').style.display = ['sent','overdue'].includes(inv.status) ? '' : 'none';
      document.getElementById('invoiceClient').value = inv.clientId || '';
      document.getElementById('invoiceClient').dispatchEvent(new Event('change'));
      setTimeout(() => { document.getElementById('invoiceProject').value = inv.projectId || ''; }, 50);
      document.getElementById('invoiceStatus').value = inv.status || 'draft';
      if (inv.dueDate) {
        const d = inv.dueDate?.toDate ? inv.dueDate.toDate() : new Date(inv.dueDate);
        document.getElementById('invoiceDue').value = d.toISOString().split('T')[0];
      }

      lineItems = (inv.lineItems || []).map(item => ({ ...item }));
      renderLineItems();
      loadInvoicesList();
    };

    document.getElementById('newInvoiceBtn').addEventListener('click', () => {
      currentInvoiceId = null;
      document.getElementById('editorTitle').textContent = 'New Invoice';
      document.getElementById('deleteInvoiceBtn').style.display = 'none';
      document.getElementById('markSentBtn').style.display = 'none';
      document.getElementById('markPaidBtn').style.display = 'none';
      document.getElementById('invoiceClient').value = '';
      document.getElementById('invoiceProject').innerHTML = '<option value="">— No project —</option>';
      document.getElementById('invoiceStatus').value = 'draft';
      document.getElementById('invoiceDue').value = '';
      lineItems = []; renderLineItems(); addLineItem();
    });

    document.getElementById('addLineBtn').addEventListener('click', addLineItem);

    function addLineItem() {
      lineItems.push({ description: '', qty: 1, unitPrice: 0 });
      renderLineItems();
      const rows = document.querySelectorAll('#lineItemsBody tr');
      rows[rows.length - 1]?.querySelector('input')?.focus();
    }

    function renderLineItems() {
      const tbody = document.getElementById('lineItemsBody');
      tbody.innerHTML = lineItems.map((item, i) => `
        <tr>
          <td><input class="line-item-input" type="text" value="${escHtml(item.description)}" placeholder="Description" oninput="updateItem(${i},'description',this.value)"></td>
          <td><input class="line-item-input narrow" type="number" value="${item.qty}" min="0" step="any" oninput="updateItem(${i},'qty',+this.value)"></td>
          <td><input class="line-item-input narrow" type="number" value="${item.unitPrice}" min="0" step="0.01" placeholder="0.00" oninput="updateItem(${i},'unitPrice',+this.value)"></td>
          <td style="font-size:13px;font-family:'Tektur',sans-serif;padding:5px 8px;">${formatCurrency(item.qty * item.unitPrice)}</td>
          <td><button class="remove-row-btn" onclick="removeItem(${i})">×</button></td>
        </tr>`).join('');
      recalcTotal();
    }

    window.updateItem = (i, field, val) => { lineItems[i][field] = val; recalcTotal(); renderRowTotal(i); };
    window.removeItem = (i) => { lineItems.splice(i, 1); renderLineItems(); };

    function renderRowTotal(i) {
      const rows = document.querySelectorAll('#lineItemsBody tr');
      if (rows[i]) {
        const cells = rows[i].querySelectorAll('td');
        if (cells[3]) cells[3].textContent = formatCurrency(lineItems[i].qty * lineItems[i].unitPrice);
      }
      recalcTotal();
    }

    function recalcTotal() {
      const total = lineItems.reduce((s, item) => s + (item.qty * item.unitPrice), 0);
      document.getElementById('grandTotal').textContent = formatCurrency(total);
      return total;
    }

    document.getElementById('saveInvoiceBtn').addEventListener('click', () => saveInvoice());
    document.getElementById('markSentBtn').addEventListener('click', () => { document.getElementById('invoiceStatus').value = 'sent'; saveInvoice(); });
    document.getElementById('markPaidBtn').addEventListener('click', () => { document.getElementById('invoiceStatus').value = 'paid'; saveInvoice(); });

    async function saveInvoice() {
      const clientId = document.getElementById('invoiceClient').value;
      if (!clientId) { showToast('Select a client.', 'error'); return; }

      const btn = document.getElementById('saveInvoiceBtn');
      btn.disabled = true; btn.textContent = 'Saving…';

      const dueVal = document.getElementById('invoiceDue').value;
      const total = lineItems.reduce((s, i) => s + (i.qty * i.unitPrice), 0);
      const data = {
        clientId,
        projectId: document.getElementById('invoiceProject').value || '',
        status: document.getElementById('invoiceStatus').value,
        dueDate: dueVal ? new Date(dueVal) : null,
        lineItems: lineItems.map(({ description, qty, unitPrice }) => ({ description, qty, unitPrice })),
        total,
        updatedAt: serverTimestamp()
      };

      try {
        if (currentInvoiceId) {
          await setDoc(doc(db, 'invoices', currentInvoiceId), data, { merge: true });
        } else {
          data.createdAt = serverTimestamp();
          const ref = await addDoc(collection(db, 'invoices'), data);
          currentInvoiceId = ref.id;
          document.getElementById('deleteInvoiceBtn').style.display = '';
        }
        showToast('Invoice saved.');
        await loadInvoicesList();
        // Update quick-action buttons
        const status = data.status;
        document.getElementById('markSentBtn').style.display = status === 'draft' ? '' : 'none';
        document.getElementById('markPaidBtn').style.display = ['sent','overdue'].includes(status) ? '' : 'none';
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
      btn.disabled = false; btn.textContent = 'Save';
    }

    document.getElementById('deleteInvoiceBtn').addEventListener('click', async () => {
      if (!currentInvoiceId || !confirm('Delete this invoice?')) return;
      await deleteDoc(doc(db, 'invoices', currentInvoiceId));
      currentInvoiceId = null;
      document.getElementById('editorTitle').textContent = 'New Invoice';
      document.getElementById('deleteInvoiceBtn').style.display = 'none';
      lineItems = []; renderLineItems(); addLineItem();
      await loadInvoicesList();
      showToast('Invoice deleted.');
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => { await signOut(auth); window.location.href = '../index.html'; });

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.classList.remove('show'), 3000);
    }
    function badgeClass(s) {
      const m = {'draft':'badge-draft','sent':'badge-sent','paid':'badge-paid','overdue':'badge-overdue'};
      return m[s] || 'badge-draft';
    }
    function formatCurrency(n) { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n || 0); }
    function escHtml(s) { return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  </script>

</body>
</html>
