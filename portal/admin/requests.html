<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requests — Admin Portal</title>
  <link rel="stylesheet" href="../portal.css">
</head>
<body>

  <nav class="portal-nav">
    <a href="dashboard.html" class="nav-brand">Jake Lewien <span>| Admin</span></a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="clients.html">Clients</a>
      <a href="quote.html">Quotes</a>
      <a href="invoice.html">Invoices</a>
      <a href="requests.html" class="active">Requests <span class="unread-dot" id="newDot" style="display:none;"></span></a>
      <a href="messages.html">Messages</a>
    </div>
    <div class="nav-user">
      <span class="nav-user-name" id="userName"></span>
      <span class="admin-badge">Admin</span>
      <button class="btn-logout" id="logoutBtn">Log out</button>
    </div>
  </nav>

  <div class="portal-page">
    <div class="split-layout">

      <!-- Sidebar: request list -->
      <div class="split-sidebar">
        <div style="padding:0 16px 12px;display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);">All Requests</span>
          <span id="requestCount" style="font-size:12px;color:var(--text-dim);"></span>
        </div>
        <div id="requestList"><div class="empty-state" style="padding:32px;"><p>Loading…</p></div></div>
      </div>

      <!-- Main: selected request detail -->
      <div class="split-main">

        <div id="noSelection" style="display:flex;align-items:center;justify-content:center;height:300px;">
          <div class="empty-state"><div class="empty-icon">📋</div><p>Select a request to view details.</p></div>
        </div>

        <div id="detailPanel" style="display:none;">

          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px;">
            <div>
              <h2 id="detailName" style="font-family:'Tektur',sans-serif;font-size:20px;margin-bottom:4px;"></h2>
              <div id="detailMeta" style="font-size:13px;color:var(--text-muted);"></div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-outline btn-sm" id="actionMessages">View Messages</button>
              <button class="btn btn-outline btn-sm" id="actionQuote">Create Quote</button>
              <button class="btn btn-primary btn-sm" id="actionReviewed">Mark as Reviewed</button>
            </div>
          </div>

          <!-- Detail cards -->
          <div class="grid-2" style="margin-bottom:16px;">
            <div class="card">
              <div class="card-header"><span class="card-title">Project Request</span></div>
              <div style="margin-bottom:12px;">
                <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:4px;">Project Type</div>
                <span class="badge badge-progress" id="detailType"></span>
              </div>
              <div style="margin-bottom:12px;">
                <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:4px;">Status</div>
                <span class="badge" id="detailStatus"></span>
              </div>
              <div>
                <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:4px;">Submitted</div>
                <span id="detailDate" style="font-size:13px;"></span>
              </div>
            </div>
            <div class="card">
              <div class="card-header"><span class="card-title">Client Info</span></div>
              <div style="margin-bottom:8px;">
                <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:4px;">Email</div>
                <span id="detailEmail" style="font-size:13px;"></span>
              </div>
              <div>
                <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:4px;">Company</div>
                <span id="detailCompany" style="font-size:13px;color:var(--text-muted);"></span>
              </div>
            </div>
          </div>

          <div class="card" style="margin-bottom:16px;">
            <div class="card-header"><span class="card-title">Description</span></div>
            <p id="detailDesc" style="font-size:14px;color:var(--text-muted);line-height:1.65;white-space:pre-wrap;"></p>
          </div>

          <div class="grid-2">
            <div class="card" id="timelineCard">
              <div class="card-header"><span class="card-title">Timeline</span></div>
              <p id="detailTimeline" style="font-size:14px;color:var(--text-muted);"></p>
            </div>
            <div class="card" id="notesCard">
              <div class="card-header"><span class="card-title">Additional Notes</span></div>
              <p id="detailNotes" style="font-size:14px;color:var(--text-muted);line-height:1.65;"></p>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { auth, db } from '../firebase-config.js';
    import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { doc, getDoc, collection, query, orderBy, getDocs, updateDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    let allRequests = [];
    let activeId = null;

    const params = new URLSearchParams(window.location.search);
    const preload = params.get('id');

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = '../index.html'; return; }
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      if (!userDoc.exists() || userDoc.data().role !== 'admin') { window.location.href = '../index.html'; return; }
      document.getElementById('userName').textContent = userDoc.data().name || user.email;
      await loadRequests();
      if (preload) showDetail(preload);
    });

    async function loadRequests() {
      const snap = await getDocs(query(collection(db, 'quoteRequests'), orderBy('createdAt', 'desc')));
      allRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      const newCount = allRequests.filter(r => r.status === 'new').length;
      document.getElementById('requestCount').textContent = `${allRequests.length} total`;
      document.getElementById('newDot').style.display = newCount > 0 ? 'inline-block' : 'none';

      const container = document.getElementById('requestList');
      if (allRequests.length === 0) {
        container.innerHTML = '<div class="empty-state" style="padding:32px;"><p>No requests yet.</p></div>';
        return;
      }

      container.innerHTML = allRequests.map(r => `
        <div class="sidebar-item ${r.id === activeId ? 'active' : ''}" onclick="showDetail('${r.id}')">
          <div style="flex:1;min-width:0;">
            <div class="sidebar-item-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.name}</div>
            <div class="sidebar-item-sub">${r.projectType} · <span style="color:${statusColor(r.status)}">${r.status}</span></div>
          </div>
          ${r.status === 'new' ? '<span class="unread-dot"></span>' : ''}
        </div>`).join('');
    }

    window.showDetail = async (id) => {
      activeId = id;
      const req = allRequests.find(r => r.id === id);
      if (!req) return;

      document.getElementById('noSelection').style.display = 'none';
      document.getElementById('detailPanel').style.display = '';

      document.getElementById('detailName').textContent = req.name;
      document.getElementById('detailMeta').textContent = req.email + (req.company ? ` · ${req.company}` : '');
      document.getElementById('detailType').textContent = req.projectType;
      document.getElementById('detailEmail').textContent = req.email;
      document.getElementById('detailCompany').textContent = req.company || '—';
      document.getElementById('detailDate').textContent = formatDate(req.createdAt);
      document.getElementById('detailDesc').textContent = req.description;
      document.getElementById('detailTimeline').textContent = req.timeline || '—';
      document.getElementById('detailNotes').textContent = req.notes || '—';

      const statusEl = document.getElementById('detailStatus');
      statusEl.textContent = req.status;
      statusEl.className = `badge ${statusBadge(req.status)}`;

      document.getElementById('actionReviewed').style.display = req.status === 'new' ? '' : 'none';
      document.getElementById('timelineCard').style.display = req.timeline ? '' : 'none';
      document.getElementById('notesCard').style.display = req.notes ? '' : 'none';

      // Get clientId for action buttons
      document.getElementById('actionMessages').onclick = () => {
        window.location.href = `messages.html?client=${req.clientId}`;
      };
      document.getElementById('actionQuote').onclick = () => {
        window.location.href = `quote.html?client=${req.clientId}`;
      };
      document.getElementById('actionReviewed').onclick = async () => {
        await updateDoc(doc(db, 'quoteRequests', id), { status: 'reviewed' });
        req.status = 'reviewed';
        document.getElementById('detailStatus').textContent = 'reviewed';
        document.getElementById('detailStatus').className = 'badge badge-pending';
        document.getElementById('actionReviewed').style.display = 'none';
        await loadRequests();
        showToast('Marked as reviewed.');
      };

      // Refresh sidebar highlight
      document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
      const items = document.querySelectorAll('#requestList .sidebar-item');
      const idx = allRequests.findIndex(r => r.id === id);
      if (items[idx]) items[idx].classList.add('active');
    };

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = '../index.html';
    });

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.classList.remove('show'), 3000);
    }
    function formatDate(val) {
      if (!val) return '—';
      const d = val?.toDate ? val.toDate() : new Date(val);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function statusBadge(s) {
      return s === 'new' ? 'badge-progress' : s === 'reviewed' ? 'badge-pending' : 'badge-complete';
    }
    function statusColor(s) {
      return s === 'new' ? 'var(--blue-bright)' : s === 'reviewed' ? 'var(--text-muted)' : 'var(--accent-green)';
    }
  </script>

</body>
</html>
